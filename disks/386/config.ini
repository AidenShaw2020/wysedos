; Written by the on-screen settings menu.

[pc]
mem=16M
vga_mem=8192K
cpu=5
fpu=1
bios=bios.bin
vga_bios=vgabios.bin

; Disk images
hda=host:emmc
cdc=usb:ucd1
timezone=cet
firmware_timer_us=5000
usb_storage=1
devctl=1

[X86Pi]
volume=12
vol_pcspeaker=16
vol_adlib=16
vol_soundblaster=16
vol_midi=16
vol_tandy=16
vol_covox=16
vol_headphones=16
pcspeaker=1
adlib=1
soundblaster=1
mpu401=1
tandy=0
covox=0
dss=0
mouse=1
mouse_invert_y=0
mouse_speed=100
joystick=0
power_restore=1
power_button=0
picture=0
